services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Docker network the DB is reachable by service name, not "localhost".
      POSTGRES_HOST: postgres
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      args:
        # Baked into the browser bundle at build time, so it must be a host-reachable
        # URL (the browser runs outside the Docker network).
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${PORT}"
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
